name: PR Health (AI + Slack)

on:
  pull_request:
    types: [opened]

jobs:
  pr-health:
    runs-on: ubuntu-latest

    steps:
      - name: Generate PR health using AI
        id: ai
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: |
          PROMPT=$(cat << 'EOF'
          You are a senior Android tech lead.

          Evaluate the health of this Pull Request.

          Rules:
          - If files changed > 15 → warning
          - If additions + deletions > 500 → risky
          - If description is empty → unhealthy
          - Small focused PRs are healthy

          Respond ONLY in JSON:
          {
            "health": "green | yellow | red",
            "summary": "short explanation",
            "warnings": ["list of warnings"]
          }

          PR Title: "${{ github.event.pull_request.title }}"
          PR Description: "${{ github.event.pull_request.body }}"
          Files changed: ${{ github.event.pull_request.changed_files }}
          Additions: ${{ github.event.pull_request.additions }}
          Deletions: ${{ github.event.pull_request.deletions }}
          EOF
          )

          curl -s https://router.huggingface.co/hf-inference/models/mistralai/Mistral-7B-Instruct \
            -H "Authorization: Bearer $HF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"inputs\": \"$PROMPT\"}" > ai_output.json

          AI_TEXT=$(cat ai_output.json | jq -r '.[0].generated_text')

          echo "AI_RESULT<<EOF" >> $GITHUB_ENV
          echo "$AI_TEXT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send PR Health to Slack
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "*🤖 PR Health Report*\n\n*Repo:* ${{ github.repository }}\n*PR:* ${{ github.event.pull_request.title }}\n*Author:* ${{ github.actor }}\n\n*AI Analysis:*\n```$AI_RESULT```"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
